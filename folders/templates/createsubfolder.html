{% extends 'master.html' %}
{% block body %}
<div class="container-fluid p-0">
    <div class="row g-0">
        {% include 'sidebar.html' %}
        <div class="col-md-10 p-4">
            <div class="row justify-content-center">
                <div class="col-md-6">
                    <div class="card shadow-sm">
                        <div class="card-header text-center">
                            <h5 class="mb-0">Create Subfolder</h5>
                        </div>
                        <div class="card-body">
                            <p class="text-center text-muted small">Parent Folder: {{ parent.folder_name }}</p>
                            <form method="post">
                                {% csrf_token %}
                                <div class="mb-3">
                                    <label class="form-label">Folder Name</label>
                                    <input type="text" name="folder_name" class="form-control" required>
                                </div>
                                <div class="text-center">
                                    <button type="submit" class="btn btn-primary btn-sm">Create</button>
                                    <a href="/open_folder/{{ parent.id }}" class="btn btn-secondary btn-sm">Cancel</a>
                                </div>
                            </form>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
